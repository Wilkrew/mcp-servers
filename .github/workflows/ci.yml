name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Search evals (Python, standard library only)
        working-directory: packages/heinel-dev
        run: |
          python3 -m unittest discover -s evals/search -v
          PORT=3333 node --experimental-strip-types src/http.ts > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3333/mcp && break; sleep 1; done
          python3 evals/search/run.py --url http://localhost:3333/mcp --markdown "$GITHUB_STEP_SUMMARY"
